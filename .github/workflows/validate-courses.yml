name: Validate courses

# Runs the same check contributors are asked to run locally before opening a
# PR (README.md's "Adding a new course" checklist, step 6) — this just
# enforces it automatically instead of trusting it happened. See
# validate_course.py's own doc comment for what it checks.
on:
  pull_request:
    paths:
      - "*/meta.json"
      - "*/*.zip"
      - "*/source/**"
      - "validate_course.py"
      - "build_course_zip.py"
      - "tools/build_catalog.py"
  push:
    branches: [main]
    paths:
      - "*/meta.json"
      - "*/*.zip"
      - "*/source/**"
      - "validate_course.py"
      - "build_course_zip.py"
      - "tools/build_catalog.py"
  workflow_dispatch: {}

# A new push to the same PR/branch supersedes the previous run's result —
# no need to keep an outdated run going once a newer one has started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate every course
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A default checkout leaves HEAD detached, which git-auto-commit
          # can't push from — need the actual PR/push branch checked out.
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # A course with no meta.json "id" falls back to identifying itself
      # by its GitHub folder name — fine until that folder is ever renamed,
      # at which point "check for updates" silently breaks for everyone
      # who already installed it (see ensure_course_ids.py's own doc
      # comment, and docs/ARCHITECTURE.md in the Yaaddi app repo). Assigns
      # one automatically rather than only warning about it, since this is
      # a mechanical, always-safe default (the folder name itself) with no
      # judgment call for the author to make.
      - name: Auto-assign missing course ids
        run: python ensure_course_ids.py

      # Only actually pushes if ensure_course_ids.py changed something —
      # a no-op run leaves the working tree clean and this step no-ops too.
      # On a pull_request from a fork, GITHUB_TOKEN is read-only by GitHub's
      # own default security policy, so this step fails to push there —
      # expected: a fork PR just keeps its "no id assigned" warning until
      # the author runs the script locally and commits it themselves,
      # exactly like before this automation existed.
      - name: Commit auto-assigned ids, if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-assign missing course id(s)"
          file_pattern: "*/meta.json"

      # catalog.json (tools/build_catalog.py) is the single-file course
      # index the app fetches for a fast, one-request Course Library load —
      # see that script's own doc comment, and src/lib/githubMarketplace.ts's
      # tryFetchCatalog in the Yaaddi app repo. Regenerated here so an
      # author never has to remember to run it locally after adding/editing
      # a course, same reasoning as the id auto-assign step above. Runs
      # after that step so a freshly-assigned id is already on disk and
      # gets included.
      - name: Regenerate catalog.json
        run: python tools/build_catalog.py

      # Same no-op-if-nothing-changed and fork-PR caveat as the id
      # auto-commit step above.
      - name: Commit regenerated catalog.json, if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate catalog.json"
          file_pattern: "catalog.json"

      # validate_course.py is stdlib-only by design (see its own doc
      # comment) — no dependency installation step needed. Runs after the
      # auto-assign step above, against whatever's now on disk (freshly
      # assigned ids included), so a PR that only needed an id doesn't
      # fail the check it was just auto-fixed for.
      - name: Run validator
        run: python validate_course.py --all --source

      # PR-time smoke test for the GitHub Pages site build (tools/build_site.py).
      # pages.yml only runs on push to main, after merge — without this step, a
      # course change that crashes the site build (e.g. malformed meta.json)
      # would pass PR validation clean and only surface as a broken live site
      # after merge, with no warning beforehand. This builds to a throwaway
      # /tmp dir and never deploys anything.
      - name: Smoke-test the course catalog site build
        run: python tools/build_site.py --out /tmp/site_smoke_test
