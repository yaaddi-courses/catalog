name: Release changed courses

# Builds and publishes a GitHub Release (with the built <slug>.zip attached)
# for only the course(s) whose source/meta.json actually changed in this
# push — not the whole catalog every time, which would be wasteful once
# there are many courses and pointless churn on unrelated courses' release
# history. See README.md's "Delivery mechanism" note and
# build_release_zip.py's own doc comment for why the built file is a
# Release asset rather than something committed to the repo tree.
on:
  push:
    branches: [main]
    paths:
      - "*/meta.json"
      - "*/source/**"
      - "build_release_zip.py"
  workflow_dispatch:
    inputs:
      course:
        description: "Course folder to release (leave empty to auto-detect from the last push)"
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build + release changed courses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Detect changed course folders
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.course }}" ]; then
            echo "courses=${{ github.event.inputs.course }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to this branch, or the diff base doesn't exist locally
            # (e.g. a force-push) — fall back to just the tip commit's own changes.
            RANGE="${{ github.sha }}~1..${{ github.sha }}"
          else
            RANGE="$BEFORE..${{ github.sha }}"
          fi

          # Only top-level folders that both changed AND currently have a
          # meta.json (skips repo-root files like README.md that the path
          # filter above wouldn't match anyway, plus any folder mid-removal).
          CHANGED=$(git diff --name-only $RANGE -- '*/meta.json' '*/source/**' \
            | cut -d/ -f1 | sort -u \
            | while read -r dir; do [ -f "$dir/meta.json" ] && echo "$dir"; done)

          echo "Changed course folders: $CHANGED"
          echo "courses<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build + release each changed course
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for course in ${{ steps.changed.outputs.courses }}; do
            echo "::group::$course"

            OUT=$(python build_release_zip.py "$course")
            SLUG=$(echo "$OUT" | grep -o 'slug=[^ ]*' | cut -d= -f2)
            VERSION=$(echo "$OUT" | grep -o 'version=[^ ]*' | cut -d= -f2)
            TAG="${SLUG}-v${VERSION}"

            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists — skipping (bump meta.csv's version to publish a new one)."
            else
              gh release create "$TAG" "$course/$SLUG.zip" \
                --title "$SLUG $VERSION" \
                --notes "Automated build from $course/source/ at ${{ github.sha }}."
              echo "Published $TAG"
            fi

            echo "::endgroup::"
          done
