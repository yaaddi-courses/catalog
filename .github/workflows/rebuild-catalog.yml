name: Rebuild catalog

# Replaces the old monorepo's per-push catalog regeneration (there's no
# single push event that could trigger this anymore — a course's own repo
# changing doesn't touch this repo at all). Runs on a schedule, and can
# always be triggered manually (Actions tab -> Rebuild catalog -> Run
# workflow) right after tagging a brand-new course repo, instead of
# waiting for the next scheduled run.
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    name: Scan the org and rebuild catalog.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every course repo is public, so the automatic per-job token is enough to
      # search the org (verified 2026-11-08). The old fine-grained PAT
      # (secrets.ORG_CATALOG_PAT) expired and made this job fail with 401
      # "Bad credentials" every run from 2026-11-01; do not reintroduce a PAT unless
      # a course repo ever becomes private.
      - name: Rebuild catalog.json from the org
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_catalog.py

      - name: Commit catalog.json, if changed
        # Third-party action with contents: write: pinned to a commit (v5.2.0), not a movable tag.
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: rebuild catalog.json"
          file_pattern: "catalog.json"
